<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🌸 AirBloom — Draw with Your Hands</title>

<!-- MediaPipe Tasks Vision -->
<script type="module">
    import {
        HandLandmarker,
        FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

    window.HandLandmarker = HandLandmarker;
    window.FilesetResolver = FilesetResolver;

    window.dispatchEvent(new Event("mediapipe-ready"));
</script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(160, 70, 255, 0.30),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(0, 180, 255, 0.20),
            transparent 35%
        ),
        #080b16;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;

    padding: 20px;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 1200px;
    text-align: center;
}


/* =========================================================
   TITLE
========================================================= */

h1 {
    margin: 5px 0 4px;

    font-size: clamp(32px, 5vw, 52px);

    background:
        linear-gradient(
            90deg,
            #ff79c8,
            #c69cff,
            #65d9ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #bfc1d4;
    margin-bottom: 20px;
    font-size: 15px;
}


/* =========================================================
   CAMERA STAGE
========================================================= */

.stage {
    position: relative;

    width: 100%;
    max-width: 1100px;

    margin: auto;

    background: #000;

    border-radius: 25px;

    overflow: hidden;

    box-shadow:
        0 0 50px rgba(160, 90, 255, 0.25);

    aspect-ratio: 16 / 9;
}


/* CAMERA */

#video {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    background: #000;
}


/* DRAWING */

#drawCanvas,
#handCanvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* HAND CANVAS ABOVE DRAWING */

#handCanvas {
    z-index: 3;
}

#drawCanvas {
    z-index: 2;
}


/* =========================================================
   LOADING
========================================================= */

#loading {

    position: absolute;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 12px;

    background:
        rgba(5, 5, 15, 0.92);

    font-size: 18px;

    font-weight: bold;
}

.loader {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,0.15);

    border-top-color: #ff8bd4;

    animation:
        spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: inline-block;

    margin: 18px auto 12px;

    padding: 11px 25px;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.12);

    font-weight: bold;

    font-size: 17px;
}

.status.draw {
    color: #ff8bd4;
}

.status.pause {
    color: #ffd166;
}

.status.clear {
    color: #ff7070;
}

.status.ready {
    color: #66f2c2;
}


/* =========================================================
   HAND STATUS
========================================================= */

.hands-status {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-bottom: 14px;
}

.hand-box {

    min-width: 190px;

    padding: 10px 18px;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.055);

    border:
        1px solid
        rgba(255,255,255,0.09);

    color: #9295a8;

    transition: 0.2s;
}

.hand-box.active {
    color: white;

    background:
        rgba(255,255,255,0.10);
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 12px;
}

button {

    border: none;

    padding: 13px 24px;

    border-radius: 25px;

    color: white;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

    touch-action: manipulation;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(160,100,255,0.3);
}

button:active {
    transform: scale(0.97);
}

.clear {
    background:
        linear-gradient(
            135deg,
            #ff416c,
            #ff4b2b
        );
}

.save {
    background:
        linear-gradient(
            135deg,
            #00b894,
            #00cec9
        );
}


/* =========================================================
   INSTRUCTIONS
========================================================= */

.instructions {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 22px;
}

.gesture {

    min-width: 160px;

    padding: 12px 18px;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.055);

    border:
        1px solid
        rgba(255,255,255,0.08);
}

.gesture-icon {
    display: block;
    font-size: 26px;
    margin-bottom: 4px;
}

.gesture small {
    display: block;

    color: #9699aa;

    margin-top: 4px;
}


/* =========================================================
   INFO
========================================================= */

#info {

    margin-top: 14px;

    color: #888c9f;

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    .app {
        width: 100%;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 13px;
        margin-bottom: 12px;
    }

    .stage {
        border-radius: 17px;

        /*
           On mobile the camera
           is a little taller.
        */
        aspect-ratio: 4 / 3;
    }

    .status {
        margin: 12px auto 10px;

        font-size: 14px;

        padding: 9px 17px;
    }

    .hand-box {
        min-width: 150px;

        font-size: 13px;

        padding: 9px 12px;
    }

    button {
        padding: 11px 18px;
        font-size: 14px;
    }

    .gesture {
        min-width: 140px;
        flex: 1;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 400px) {

    body {
        padding: 5px;
    }

    h1 {
        font-size: 29px;
    }

    .gesture {
        min-width: 120px;
    }

    .gesture small {
        font-size: 11px;
    }
}

</style>
</head>


<body>

<div class="app">

    <h1>🌸 AirBloom</h1>

    <div class="subtitle">
        Draw beautiful flowers in the air with your hands
    </div>


    <!-- =====================================================
         CAMERA
    ===================================================== -->

    <div class="stage">

        <div id="loading">

            <div class="loader"></div>

            <div id="loadingText">
                🌸 AirBloom is loading...
            </div>

        </div>


        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>


        <canvas
            id="drawCanvas">
        </canvas>


        <canvas
            id="handCanvas">
        </canvas>

    </div>


    <!-- =====================================================
         MAIN STATUS
    ===================================================== -->

    <div
        id="status"
        class="status pause">

        ⏳ Starting...

    </div>


    <!-- =====================================================
         HAND STATUS
    ===================================================== -->

    <div class="hands-status">

        <div
            id="leftStatus"
            class="hand-box">

            👈 LEFT HAND:
            Not detected

        </div>


        <div
            id="rightStatus"
            class="hand-box">

            👉 RIGHT HAND:
            Not detected

        </div>

    </div>


    <!-- =====================================================
         BUTTONS
    ===================================================== -->

    <div class="controls">

        <button
            class="clear"
            id="clearBtn">

            🗑️ Clear

        </button>


        <button
            class="save"
            id="saveBtn">

            💾 Save Drawing

        </button>

    </div>


    <!-- =====================================================
         INSTRUCTIONS
    ===================================================== -->

    <div class="instructions">

        <div class="gesture">

            <span class="gesture-icon">☝️</span>

            <b>DRAW</b>

            <small>
                Index finger only
            </small>

        </div>


        <div class="gesture">

            <span class="gesture-icon">✋</span>

            <b>PAUSE</b>

            <small>
                Open hand
            </small>

        </div>


        <div class="gesture">

            <span class="gesture-icon">✊</span>

            <b>CLEAR</b>

            <small>
                Closed fist
            </small>

        </div>

    </div>


    <div id="info">
        Preparing camera...
    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const drawCanvas =
    document.getElementById("drawCanvas");

const handCanvas =
    document.getElementById("handCanvas");

const drawCtx =
    drawCanvas.getContext("2d");

const handCtx =
    handCanvas.getContext("2d");

const status =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const info =
    document.getElementById("info");

const leftStatus =
    document.getElementById("leftStatus");

const rightStatus =
    document.getElementById("rightStatus");

const clearBtn =
    document.getElementById("clearBtn");

const saveBtn =
    document.getElementById("saveBtn");


/* =========================================================
   VARIABLES
========================================================= */

let handLandmarker = null;

let cameraStream = null;

let running = false;

let lastVideoTime = -1;


/*
   Previous drawing position
   for each hand.
*/

let leftPrevious = null;

let rightPrevious = null;


/*
   Clear protection.
*/

let lastClearTime = 0;


/*
   Flowers.
*/

let flowerCounter = 0;


/*
   Prevent repeated camera frames
   from creating too many flowers.
*/

let lastDrawTimeLeft = 0;
let lastDrawTimeRight = 0;


/* =========================================================
   COLORS
========================================================= */

const colors = [
    "#ff69b4",
    "#ff9de2",
    "#c77dff",
    "#9b5de5",
    "#00bbf9",
    "#00f5d4",
    "#fee440",
    "#ff7b00"
];


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    const rect =
        video.getBoundingClientRect();

    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {
        return;
    }

    /*
       Use devicePixelRatio
       for sharper drawings.
    */

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    drawCanvas.width =
        Math.round(rect.width * dpr);

    drawCanvas.height =
        Math.round(rect.height * dpr);

    handCanvas.width =
        Math.round(rect.width * dpr);

    handCanvas.height =
        Math.round(rect.height * dpr);


    drawCanvas.style.width =
        rect.width + "px";

    drawCanvas.style.height =
        rect.height + "px";

    handCanvas.style.width =
        rect.width + "px";

    handCanvas.style.height =
        rect.height + "px";


    drawCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    handCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   GET DISPLAY SIZE
========================================================= */

function getDisplaySize() {

    const rect =
        video.getBoundingClientRect();

    return {
        width: rect.width,
        height: rect.height
    };
}


/* =========================================================
   CONVERT LANDMARK TO SCREEN
========================================================= */

function landmarkToScreen(point) {

    const size =
        getDisplaySize();

    return {

        /*
           Camera is mirrored,
           therefore X is reversed.
        */

        x:
            (1 - point.x)
            * size.width,

        y:
            point.y
            * size.height
    };
}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

/*
   This version uses the wrist
   and PIP distance.

   It is more stable than simply
   checking Y coordinates.
*/

function isFingerExtended(
    landmarks,
    tipIndex,
    pipIndex
) {

    const wrist =
        landmarks[0];

    const tip =
        landmarks[tipIndex];

    const pip =
        landmarks[pipIndex];


    const tipDistance =
        distance(
            tip,
            wrist
        );

    const pipDistance =
        distance(
            pip,
            wrist
        );


    return (
        tipDistance >
        pipDistance * 1.12
    );
}


/* =========================================================
   THUMB
========================================================= */

function isThumbExtended(
    landmarks
) {

    const wrist =
        landmarks[0];

    const thumbTip =
        landmarks[4];

    const thumbIP =
        landmarks[3];


    return (
        distance(
            thumbTip,
            wrist
        )
        >
        distance(
            thumbIP,
            wrist
        ) * 1.08
    );
}


/* =========================================================
   GESTURE
========================================================= */

function detectGesture(
    landmarks
) {

    const index =
        isFingerExtended(
            landmarks,
            8,
            6
        );

    const middle =
        isFingerExtended(
            landmarks,
            12,
            10
        );

    const ring =
        isFingerExtended(
            landmarks,
            16,
            14
        );

    const pinky =
        isFingerExtended(
            landmarks,
            20,
            18
        );


    const extendedCount =
        [
            index,
            middle,
            ring,
            pinky
        ].filter(Boolean).length;


    /*
       INDEX ONLY
    */

    if (
        index &&
        !middle &&
        !ring &&
        !pinky
    ) {
        return "draw";
    }


    /*
       OPEN HAND
    */

    if (
        extendedCount >= 4
    ) {
        return "pause";
    }


    /*
       FIST
    */

    if (
        extendedCount === 0
    ) {
        return "clear";
    }


    /*
       Anything between
       is treated as pause.
    */

    return "pause";
}


/* =========================================================
   FLOWER
========================================================= */

function drawFlower(
    x,
    y,
    side
) {

    let color;

    if (side === "Left") {

        color =
            "#ff72c6";

    } else {

        color =
            "#67d9ff";
    }


    /*
       Occasionally change color.
    */

    if (
        flowerCounter % 5 === 0
    ) {

        color =
            colors[
                flowerCounter %
                colors.length
            ];
    }


    flowerCounter++;


    const size =
        5.5 +
        Math.random() * 6;


    drawCtx.save();

    drawCtx.translate(
        x,
        y
    );


    /*
       Glow
    */

    drawCtx.shadowBlur =
        14;

    drawCtx.shadowColor =
        color;


    /*
       Petals
    */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const angle =
            i *
            (
                Math.PI * 2 / 5
            );


        const px =
            Math.cos(angle)
            * size;


        const py =
            Math.sin(angle)
            * size;


        drawCtx.beginPath();

        drawCtx.fillStyle =
            color;

        drawCtx.globalAlpha =
            0.82;


        drawCtx.arc(
            px,
            py,
            size * 0.65,
            0,
            Math.PI * 2
        );


        drawCtx.fill();
    }


    /*
       Center
    */

    drawCtx.beginPath();

    drawCtx.fillStyle =
        "#fff3a3";

    drawCtx.globalAlpha =
        1;


    drawCtx.arc(
        0,
        0,
        size * 0.43,
        0,
        Math.PI * 2
    );


    drawCtx.fill();


    /*
       Sparkle
    */

    if (
        flowerCounter % 3 === 0
    ) {

        drawCtx.fillStyle =
            "white";

        drawCtx.font =
            "14px Arial";

        drawCtx.fillText(
            "✦",
            size + 5,
            -size - 5
        );
    }


    drawCtx.restore();
}


/* =========================================================
   CONNECTION
========================================================= */

function drawConnection(
    x1,
    y1,
    x2,
    y2,
    side
) {

    drawCtx.save();

    drawCtx.beginPath();

    drawCtx.moveTo(
        x1,
        y1
    );

    drawCtx.lineTo(
        x2,
        y2
    );


    if (side === "Left") {

        drawCtx.strokeStyle =
            "rgba(255,110,200,0.20)";

    } else {

        drawCtx.strokeStyle =
            "rgba(90,210,255,0.20)";
    }


    drawCtx.lineWidth =
        2;


    drawCtx.stroke();

    drawCtx.restore();
}


/* =========================================================
   DRAW HAND SKELETON
========================================================= */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


function drawHandSkeleton(
    landmarks,
    side
) {

    const size =
        getDisplaySize();


    if (side === "Left") {

        handCtx.strokeStyle =
            "rgba(255,100,200,0.50)";

        handCtx.fillStyle =
            "rgba(255,120,210,0.90)";

    } else {

        handCtx.strokeStyle =
            "rgba(80,210,255,0.50)";

        handCtx.fillStyle =
            "rgba(90,220,255,0.90)";
    }


    handCtx.lineWidth =
        2;


    /*
       Lines
    */

    for (
        const pair of connections
    ) {

        const p1 =
            landmarkToScreen(
                landmarks[pair[0]]
            );

        const p2 =
            landmarkToScreen(
                landmarks[pair[1]]
            );


        handCtx.beginPath();

        handCtx.moveTo(
            p1.x,
            p1.y
        );

        handCtx.lineTo(
            p2.x,
            p2.y
        );

        handCtx.stroke();
    }


    /*
       Points
    */

    for (
        const point of landmarks
    ) {

        const p =
            landmarkToScreen(
                point
            );


        handCtx.beginPath();

        handCtx.arc(
            p.x,
            p.y,
            2.5,
            0,
            Math.PI * 2
        );

        handCtx.fill();
    }
}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(
    leftMode,
    rightMode,
    count
) {

    status.className =
        "status";


    /*
       Clear
    */

    if (
        leftMode === "clear" ||
        rightMode === "clear"
    ) {

        status.classList.add(
            "clear"
        );

        status.innerHTML =
            "✊ CLEAR / DELETE";

        return;
    }


    /*
       Drawing
    */

    if (
        leftMode === "draw" &&
        rightMode === "draw"
    ) {

        status.classList.add(
            "draw"
        );

        status.innerHTML =
            "☝️☝️ TWO HANDS DRAWING";

        return;
    }


    if (
        leftMode === "draw" ||
        rightMode === "draw"
    ) {

        status.classList.add(
            "draw"
        );

        status.innerHTML =
            "☝️ DRAW MODE";

        return;
    }


    /*
       Pause
    */

    if (count > 0) {

        status.classList.add(
            "pause"
        );

        status.innerHTML =
            "✋ PAUSE MODE";

    } else {

        status.classList.add(
            "pause"
        );

        status.innerHTML =
            "👋 SHOW YOUR HAND";
    }
}


/* =========================================================
   UPDATE HAND BOX
========================================================= */

function updateHandBox(
    side,
    mode,
    detected
) {

    const element =
        side === "Left"
            ? leftStatus
            : rightStatus;


    if (!detected) {

        element.className =
            "hand-box";

        element.innerHTML =
            side === "Left"
                ? "👈 LEFT HAND: Not detected"
                : "👉 RIGHT HAND: Not detected";

        return;
    }


    element.className =
        "hand-box active";


    const emoji =
        mode === "draw"
            ? "☝️ DRAW"
            : mode === "clear"
                ? "✊ CLEAR"
                : "✋ PAUSE";


    element.innerHTML =
        side === "Left"
            ? `👈 LEFT: ${emoji}`
            : `👉 RIGHT: ${emoji}`;
}


/* =========================================================
   CLEAR
========================================================= */

function clearDrawing() {

    const size =
        getDisplaySize();


    drawCtx.clearRect(
        0,
        0,
        size.width,
        size.height
    );


    leftPrevious =
        null;

    rightPrevious =
        null;

    flowerCounter =
        0;
}


/* =========================================================
   SAVE
========================================================= */

function saveDrawing() {

    const size =
        getDisplaySize();


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        Math.round(size.width);

    temp.height =
        Math.round(size.height);


    const ctx =
        temp.getContext("2d");


    /*
       Background
    */

    ctx.fillStyle =
        "#080b16";


    ctx.fillRect(
        0,
        0,
        temp.width,
        temp.height
    );


    /*
       Drawing
    */

    ctx.drawImage(
        drawCanvas,
        0,
        0,
        drawCanvas.width,
        drawCanvas.height,
        0,
        0,
        temp.width,
        temp.height
    );


    /*
       Download
    */

    const link =
        document.createElement(
            "a"
        );


    link.download =
        "AirBloom_Drawing.png";


    link.href =
        temp.toDataURL(
            "image/png"
        );


    link.click();
}


/* =========================================================
   PROCESS HAND
========================================================= */

function processHand(
    landmarks,
    side
) {

    const mode =
        detectGesture(
            landmarks
        );


    /*
       Only index is used
       for drawing.
    */

    if (
        mode !== "draw"
    ) {

        if (side === "Left") {

            leftPrevious =
                null;

        } else {

            rightPrevious =
                null;
        }

        return mode;
    }


    /*
       Index fingertip.
    */

    const index =
        landmarks[8];


    const point =
        landmarkToScreen(
            index
        );


    /*
       Prevent drawing too many
       flowers on every frame.
    */

    const now =
        performance.now();


    if (side === "Left") {

        if (
            now - lastDrawTimeLeft
            < 45
        ) {

            return mode;
        }


        if (
            leftPrevious !== null
        ) {

            drawConnection(
                leftPrevious.x,
                leftPrevious.y,
                point.x,
                point.y,
                "Left"
            );
        }


        drawFlower(
            point.x,
            point.y,
            "Left"
        );


        leftPrevious =
            point;


        lastDrawTimeLeft =
            now;

    }


    else {

        if (
            now - lastDrawTimeRight
            < 45
        ) {

            return mode;
        }


        if (
            rightPrevious !== null
        ) {

            drawConnection(
                rightPrevious.x,
                rightPrevious.y,
                point.x,
                point.y,
                "Right"
            );
        }


        drawFlower(
            point.x,
            point.y,
            "Right"
        );


        rightPrevious =
            point;


        lastDrawTimeRight =
            now;
    }


    return mode;
}


/* =========================================================
   PROCESS RESULTS
========================================================= */

function processResults(
    result
) {

    const size =
        getDisplaySize();


    /*
       Clear skeleton.
    */

    handCtx.clearRect(
        0,
        0,
        size.width,
        size.height
    );


    /*
       Reset UI.
    */

    updateHandBox(
        "Left",
        "pause",
        false
    );

    updateHandBox(
        "Right",
        "pause",
        false
    );


    const landmarksList =
        result.landmarks || [];


    /*
       No hands.
    */

    if (
        landmarksList.length === 0
    ) {

        leftPrevious =
            null;

        rightPrevious =
            null;


        updateStatus(
            "pause",
            "pause",
            0
        );


        info.innerHTML =
            "👋 No hand detected";

        return;
    }


    let leftMode =
        "pause";

    let rightMode =
        "pause";


    let leftDetected =
        false;

    let rightDetected =
        false;


    /*
       Process every detected hand.
    */

    for (
        let i = 0;
        i < landmarksList.length;
        i++
    ) {

        const landmarks =
            landmarksList[i];


        /*
           MediaPipe handedness.
        */

        let side =
            "Right";


        if (
            result.handedness &&
            result.handedness[i] &&
            result.handedness[i][0]
        ) {

            side =
                result.handedness[i][0].categoryName;
        }


        /*
           Because the camera is mirrored,
           MediaPipe's handedness can appear
           reversed visually.

           We compensate here.
        */

        if (
            side === "Left"
        ) {

            side = "Right";

        } else {

            side = "Left";
        }


        const mode =
            processHand(
                landmarks,
                side
            );


        drawHandSkeleton(
            landmarks,
            side
        );


        if (
            side === "Left"
        ) {

            leftMode =
                mode;

            leftDetected =
                true;

        } else {

            rightMode =
                mode;

            rightDetected =
                true;
        }
    }


    /*
       UI
    */

    updateHandBox(
        "Left",
        leftMode,
        leftDetected
    );


    updateHandBox(
        "Right",
        rightMode,
        rightDetected
    );


    updateStatus(
        leftMode,
        rightMode,
        landmarksList.length
    );


    /*
       CLEAR gesture.

       Cooldown prevents continuous
       clearing every frame.
    */

    if (
        leftMode === "clear" ||
        rightMode === "clear"
    ) {

        const now =
            Date.now();


        if (
            now - lastClearTime
            > 1200
        ) {

            clearDrawing();

            lastClearTime =
                now;
        }
    }


    info.innerHTML =
        `🖐️ ${landmarksList.length} hand(s) detected`;
}


/* =========================================================
   CAMERA LOOP
========================================================= */

async function predict() {

    if (!running) {
        return;
    }


    /*
       Only process a new video frame.
    */

    if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        try {

            const result =
                handLandmarker.detectForVideo(
                    video,
                    performance.now()
                );


            processResults(
                result
            );

        }

        catch (error) {

            console.error(
                "Detection error:",
                error
            );
        }
    }


    requestAnimationFrame(
        predict
    );
}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {

        loadingText.innerHTML =
            "📷 Requesting camera permission...";


        /*
           Ask for camera.

           Environment = rear camera
           User = front camera.

           We want front camera.
        */

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode:
                        "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30,
                        max: 60
                    }
                },

                audio: false
            });


        video.srcObject =
            cameraStream;


        await video.play();


        resizeCanvas();


        info.innerHTML =
            "📷 Camera ready — show your hands";


    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        loadingText.innerHTML = `
            ❌ Camera could not start.<br><br>
            Please allow camera access and reload the page.
        `;


        status.className =
            "status clear";


        status.innerHTML =
            "❌ CAMERA ERROR";


        info.innerHTML =
            error.message;
    }
}


/* =========================================================
   LOAD MEDIAPIPE
========================================================= */

async function initializeAirBloom() {

    try {

        loadingText.innerHTML =
            "🌸 Loading hand detector...";


        /*
           Wait for MediaPipe Tasks Vision.
        */

        if (
            !window.HandLandmarker ||
            !window.FilesetResolver
        ) {

            await new Promise(
                resolve => {

                    window.addEventListener(
                        "mediapipe-ready",
                        resolve,
                        { once: true }
                    );

                }
            );
        }


        /*
           WASM files.
        */

        const vision =
            await window.FilesetResolver.forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

            );


        loadingText.innerHTML =
            "🧠 Loading AI hand model...";


        /*
           Hand Landmarker.

           This model supports up to 2 hands.
        */

        handLandmarker =
            await window.HandLandmarker.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                        delegate:
                            "GPU"
                    },


                    runningMode:
                        "VIDEO",


                    numHands:
                        2,


                    /*
                       Lower detection threshold
                       helps when the hand moves quickly.
                    */

                    minHandDetectionConfidence:
                        0.45,


                    /*
                       Tracking confidence.
                    */

                    minHandPresenceConfidence:
                        0.45,


                    minTrackingConfidence:
                        0.45
                }
            );


        loadingText.innerHTML =
            "📷 Starting camera...";


        await startCamera();


        /*
           Everything ready.
        */

        loading.style.display =
            "none";


        status.className =
            "status ready";


        status.innerHTML =
            "🌸 AIRBLOOM IS READY";


        running =
            true;


        requestAnimationFrame(
            predict
        );

    }

    catch (error) {

        console.error(
            "AirBloom initialization error:",
            error
        );


        loadingText.innerHTML = `
            ❌ AirBloom could not start.<br><br>
            Check your internet connection,
            camera permission,
            and reload the page.
        `;


        status.className =
            "status clear";


        status.innerHTML =
            "❌ STARTUP ERROR";


        info.innerHTML =
            error.message;
    }
}


/* =========================================================
   BUTTONS
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        clearDrawing();

        status.className =
            "status ready";

        status.innerHTML =
            "🗑️ CANVAS CLEARED";

        setTimeout(
            () => {

                if (running) {

                    status.className =
                        "status ready";

                    status.innerHTML =
                        "🌸 AIRBLOOM IS READY";
                }

            },
            900
        );
    }
);


saveBtn.addEventListener(
    "click",
    saveDrawing
);


/* =========================================================
   START
========================================================= */

initializeAirBloom();

</script>
