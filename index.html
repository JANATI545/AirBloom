<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#080b16">

<title>🌸 AirBloom</title>


<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   BODY
===================================================== */

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}


body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            #35136b 0%,
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 90%,
            #06435e 0%,
            transparent 32%
        ),

        #080b16;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;

    max-width: 1250px;

    margin: auto;

    padding: 25px 20px 40px;

    text-align: center;

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    margin: 0;

    font-size: clamp(
        32px,
        5vw,
        52px
    );

    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            #ff8bd4,
            #c59cff,
            #65d9ff
        );

    -webkit-background-clip: text;

    background-clip: text;

    -webkit-text-fill-color: transparent;

}


.subtitle {

    margin-top: 8px;

    margin-bottom: 22px;

    color: #bfc2d6;

    font-size:
        clamp(
            14px,
            2vw,
            17px
        );

}


/* =====================================================
   CAMERA STAGE
===================================================== */

.stage {

    position: relative;

    width: 100%;

    max-width: 1100px;

    margin: auto;

    background: #000;

    border-radius: 25px;

    overflow: hidden;

    box-shadow:
        0 0 50px
        rgba(
            150,
            90,
            255,
            .28
        );

}


/* =====================================================
   VIDEO
===================================================== */

#video {

    display: block;

    width: 100%;

    height: auto;

    aspect-ratio: 16 / 9;

    object-fit: cover;

    background: #000;

    /*
       Mirror camera
    */

    transform: scaleX(-1);

}


/* =====================================================
   DRAW CANVAS
===================================================== */

#drawCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

}


/* =====================================================
   HAND CANVAS
===================================================== */

#handCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: absolute;

    inset: 0;

    z-index: 30;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 15px;

    padding: 20px;

    background:
        rgba(
            5,
            5,
            15,
            .92
        );

    font-size: 18px;

    font-weight: bold;

}


/* =====================================================
   LOADING SPINNER
===================================================== */

.spinner {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border: 4px solid
        rgba(
            255,
            255,
            255,
            .15
        );

    border-top-color:
        #ff8bd4;

    animation:
        spin 1s linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   START CAMERA BUTTON
===================================================== */

#startButton {

    margin-top: 15px;

    padding:
        14px
        28px;

    border: none;

    border-radius: 30px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #7c4dff,
            #d946ef
        );

    box-shadow:
        0 8px 25px
        rgba(
            180,
            100,
            255,
            .25
        );

}


#startButton:active {

    transform:
        scale(.97);

}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: inline-block;

    margin:
        18px
        auto
        12px;

    padding:
        11px
        24px;

    border-radius: 30px;

    background:
        rgba(
            255,
            255,
            255,
            .07
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    backdrop-filter:
        blur(10px);

    font-size: 17px;

    font-weight: bold;

}


.status.draw {

    color: #ff8bd4;

}


.status.pause {

    color: #ffd166;

}


.status.clear {

    color: #ff6b6b;

}


/* =====================================================
   HAND STATUS
===================================================== */

.handsStatus {

    display: flex;

    justify-content: center;

    align-items: stretch;

    gap: 12px;

    flex-wrap: wrap;

    margin:
        0
        auto
        15px;

}


.handBox {

    min-width: 190px;

    padding:
        11px
        18px;

    border-radius: 15px;

    background:
        rgba(
            255,
            255,
            255,
            .055
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .09
        );

    color: #8f92a7;

    transition:
        .2s ease;

}


.handBox.active {

    color: white;

    background:
        rgba(
            255,
            255,
            255,
            .10
        );

}


.handBox.draw {

    border-color:
        rgba(
            255,
            105,
            180,
            .5
        );

    color: #ff8bd4;

}


.handBox.draw.right {

    border-color:
        rgba(
            80,
            210,
            255,
            .5
        );

    color: #67d9ff;

}


/* =====================================================
   BUTTONS
===================================================== */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 10px;

}


button.action {

    border: none;

    padding:
        13px
        24px;

    border-radius: 25px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;

}


button.action:hover {

    transform:
        translateY(-2px);

}


button.action:active {

    transform:
        scale(.97);

}


button.clear {

    background:
        linear-gradient(
            135deg,
            #ff416c,
            #ff4b2b
        );

}


button.save {

    background:
        linear-gradient(
            135deg,
            #00b894,
            #00cec9
        );

}


/* =====================================================
   INSTRUCTIONS
===================================================== */

.instructions {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(
                150px,
                1fr
            )
        );

    gap: 12px;

    max-width: 800px;

    margin:
        25px
        auto
        0;

}


.gesture {

    padding:
        15px
        10px;

    border-radius: 16px;

    background:
        rgba(
            255,
            255,
            255,
            .055
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .09
        );

}


.gesture span {

    display: block;

    font-size: 29px;

    margin-bottom: 5px;

}


.gesture b {

    font-size: 15px;

}


.gesture small {

    display: block;

    margin-top: 5px;

    color: #9295aa;

    font-size: 12px;

}


/* =====================================================
   INFO
===================================================== */

#info {

    margin-top: 15px;

    color: #8e91a7;

    font-size: 13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 700px
) {

    .app {

        padding:
            16px
            10px
            30px;

    }


    h1 {

        font-size: 35px;

    }


    .subtitle {

        margin-bottom: 15px;

        font-size: 14px;

    }


    .stage {

        border-radius: 16px;

        width: 100%;

    }


    #video {

        /*
           On mobile keep
           16:9 camera view
        */

        aspect-ratio: 16 / 9;

    }


    .status {

        margin:
            13px
            auto
            10px;

        padding:
            9px
            17px;

        font-size: 14px;

    }


    .handsStatus {

        gap: 8px;

    }


    .handBox {

        min-width: 0;

        flex: 1;

        padding:
            9px
            7px;

        font-size: 12px;

    }


    .controls {

        gap: 8px;

    }


    button.action {

        padding:
            11px
            17px;

        font-size: 13px;

    }


    .instructions {

        grid-template-columns:
            1fr 1fr 1fr;

        gap: 6px;

        margin-top: 18px;

    }


    .gesture {

        padding:
            10px
            5px;

    }


    .gesture span {

        font-size: 23px;

    }


    .gesture b {

        font-size: 12px;

    }


    .gesture small {

        font-size: 10px;

    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media (
    max-width: 380px
) {

    .instructions {

        grid-template-columns:
            1fr;

    }


    .gesture {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 8px;

    }


    .gesture span {

        margin: 0;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         TITLE
    ================================================= -->

    <h1>

        🌸 AirBloom

    </h1>


    <div class="subtitle">

        Draw beautiful flowers with your fingers in the air

    </div>


    <!-- =================================================
         CAMERA
    ================================================= -->

    <div class="stage">


        <div id="loading">

            <div class="spinner"></div>

            <div id="loadingText">

                🌸 Camera ready

            </div>

            <button
                id="startButton"
                onclick="startAirBloom()">

                📷 Start Camera

            </button>

        </div>


        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>


        <canvas
            id="drawCanvas">
        </canvas>


        <canvas
            id="handCanvas">
        </canvas>


    </div>


    <!-- =================================================
         MAIN STATUS
    ================================================= -->

    <div
        id="status"
        class="status pause">

        ⏸️ PAUSE MODE

    </div>


    <!-- =================================================
         HAND STATUS
    ================================================= -->

    <div class="handsStatus">


        <div
            id="leftStatus"
            class="handBox">

            👈 LEFT HAND:
            Not detected

        </div>


        <div
            id="rightStatus"
            class="handBox">

            👉 RIGHT HAND:
            Not detected

        </div>


    </div>


    <!-- =================================================
         BUTTONS
    ================================================= -->

    <div class="controls">


        <button
            class="action clear"
            onclick="clearDrawing()">

            🗑️ Clear

        </button>


        <button
            class="action save"
            onclick="saveDrawing()">

            💾 Save Drawing

        </button>


    </div>


    <!-- =================================================
         INSTRUCTIONS
    ================================================= -->

    <div class="instructions">


        <div class="gesture">

            <span>☝️</span>

            <b>DRAW</b>

            <small>
                Index only
            </small>

        </div>


        <div class="gesture">

            <span>✋</span>

            <b>PAUSE</b>

            <small>
                Open hand
            </small>

        </div>


        <div class="gesture">

            <span>✊</span>

            <b>CLEAR</b>

            <small>
                Closed fist
            </small>

        </div>


    </div>


    <div id="info">

        Press "Start Camera"

    </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );


const drawCanvas =
    document.getElementById(
        "drawCanvas"
    );


const handCanvas =
    document.getElementById(
        "handCanvas"
    );


const drawCtx =
    drawCanvas.getContext(
        "2d"
    );


const handCtx =
    handCanvas.getContext(
        "2d"
    );


const status =
    document.getElementById(
        "status"
    );


const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const info =
    document.getElementById(
        "info"
    );


const leftStatus =
    document.getElementById(
        "leftStatus"
    );


const rightStatus =
    document.getElementById(
        "rightStatus"
    );


/* =====================================================
   VARIABLES
===================================================== */

let cameraStarted = false;

let processing = false;


/*
   Previous positions
*/

let leftPreviousX = null;

let leftPreviousY = null;

let rightPreviousX = null;

let rightPreviousY = null;


/*
   Clear cooldown
*/

let lastClearTime = 0;


/*
   Flower counter
*/

let flowerCounter = 0;


/*
   Gesture stabilization
*/

const gestureHistory = {

    Left: [],

    Right: []

};


/*
   Number of frames needed
   before changing gesture
*/

const STABILITY_FRAMES = 3;


/* =====================================================
   COLORS
===================================================== */

const colors = [

    "#ff69b4",
    "#ff9de2",
    "#c77dff",
    "#9b5de5",
    "#00bbf9",
    "#00f5d4",
    "#fee440",
    "#ff7b00"

];


/* =====================================================
   RESIZE CANVAS
===================================================== */

function resizeCanvas() {

    const rect =
        video.getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return;

    }


    /*
       Save old drawing
       when resizing.
    */

    const oldCanvas =
        document.createElement(
            "canvas"
        );


    oldCanvas.width =
        drawCanvas.width;


    oldCanvas.height =
        drawCanvas.height;


    if (
        oldCanvas.width > 0 &&
        oldCanvas.height > 0
    ) {

        oldCanvas
            .getContext("2d")
            .drawImage(
                drawCanvas,
                0,
                0
            );

    }


    const oldWidth =
        drawCanvas.width;


    const oldHeight =
        drawCanvas.height;


    /*
       New size
    */

    drawCanvas.width =
        Math.round(rect.width);


    drawCanvas.height =
        Math.round(rect.height);


    handCanvas.width =
        Math.round(rect.width);


    handCanvas.height =
        Math.round(rect.height);


    /*
       Restore drawing
    */

    if (
        oldWidth > 0 &&
        oldHeight > 0
    ) {

        drawCtx.drawImage(

            oldCanvas,

            0,
            0,
            oldWidth,
            oldHeight,

            0,
            0,
            drawCanvas.width,
            drawCanvas.height

        );

    }

}


window.addEventListener(
    "resize",
    resizeCanvas
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            resizeCanvas,
            300
        );

    }
);


/* =====================================================
   DISTANCE
===================================================== */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   ANGLE
===================================================== */

function angle(
    a,
    b,
    c
) {

    const abx =
        a.x - b.x;

    const aby =
        a.y - b.y;

    const cbx =
        c.x - b.x;

    const cby =
        c.y - b.y;


    const dot =
        abx * cbx +
        aby * cby;


    const mag1 =
        Math.sqrt(
            abx * abx +
            aby * aby
        );


    const mag2 =
        Math.sqrt(
            cbx * cbx +
            cby * cby
        );


    if (
        mag1 === 0 ||
        mag2 === 0
    ) {

        return 0;

    }


    let value =
        dot /
        (mag1 * mag2);


    value =
        Math.max(
            -1,
            Math.min(
                1,
                value
            )
        );


    return Math.acos(
        value
    ) * 180 / Math.PI;

}


/* =====================================================
   FINGER EXTENDED
===================================================== */

/*
   Uses joint angles instead
   of only Y coordinates.

   This is more stable when
   the hand rotates.
*/

function isFingerExtended(
    landmarks,
    mcp,
    pip,
    dip,
    tip
) {

    const a =
        angle(
            landmarks[mcp],
            landmarks[pip],
            landmarks[dip]
        );


    const b =
        angle(
            landmarks[pip],
            landmarks[dip],
            landmarks[tip]
        );


    return (
        a > 150 &&
        b > 150
    );

}


/* =====================================================
   THUMB
===================================================== */

function isThumbOpen(
    landmarks
) {

    const wrist =
        landmarks[0];

    const thumbTip =
        landmarks[4];

    const thumbIP =
        landmarks[3];


    return (
        distance(
            wrist,
            thumbTip
        ) >
        distance(
            wrist,
            thumbIP
        ) * 1.12
    );

}


/* =====================================================
   RAW GESTURE
===================================================== */

function rawGesture(
    landmarks
) {

    const index =
        isFingerExtended(
            landmarks,
            5,
            6,
            7,
            8
        );


    const middle =
        isFingerExtended(
            landmarks,
            9,
            10,
            11,
            12
        );


    const ring =
        isFingerExtended(
            landmarks,
            13,
            14,
            15,
            16
        );


    const pinky =
        isFingerExtended(
            landmarks,
            17,
            18,
            19,
            20
        );


    /*
       INDEX ONLY
    */

    if (

        index &&

        !middle &&

        !ring &&

        !pinky

    ) {

        return "draw";

    }


    /*
       OPEN HAND
    */

    if (

        index &&

        middle &&

        ring &&

        pinky

    ) {

        return "pause";

    }


    /*
       FIST
    */

    if (

        !index &&

        !middle &&

        !ring &&

        !pinky

    ) {

        return "clear";

    }


    /*
       Ambiguous position
       => pause
    */

    return "pause";

}


/* =====================================================
   STABLE GESTURE
===================================================== */

function stableGesture(
    landmarks,
    side
) {

    const current =
        rawGesture(
            landmarks
        );


    const history =
        gestureHistory[side];


    history.push(
        current
    );


    /*
       Keep only last frames
    */

    while (
        history.length >
        STABILITY_FRAMES
    ) {

        history.shift();

    }


    /*
       If not enough frames
    */

    if (
        history.length <
        STABILITY_FRAMES
    ) {

        /*
           During startup use
           current gesture.
        */

        return current;

    }


    /*
       Count gestures
    */

    const counts = {

        draw: 0,

        pause: 0,

        clear: 0

    };


    history.forEach(
        g => {

            counts[g]++;

        }
    );


    /*
       Find majority
    */

    let best =
        "pause";


    let bestCount =
        0;


    for (
        const key
        of Object.keys(counts)
    ) {

        if (
            counts[key] >
            bestCount
        ) {

            best =
                key;

            bestCount =
                counts[key];

        }

    }


    /*
       Need majority
    */

    if (
        bestCount >= 2
    ) {

        return best;

    }


    return "pause";

}


/* =====================================================
   DRAW FLOWER
===================================================== */

function drawFlower(
    x,
    y,
    side
) {

    let color;


    if (
        side === "Left"
    ) {

        color =
            "#ff72c6";

    }

    else {

        color =
            "#67d9ff";

    }


    /*
       Occasionally random
       colors
    */

    if (
        flowerCounter % 6 === 0
    ) {

        color =
            colors[
                flowerCounter %
                colors.length
            ];

    }


    flowerCounter++;


    const size =
        5 +
        Math.random() * 6;


    drawCtx.save();


    drawCtx.translate(
        x,
        y
    );


    /*
       Glow
    */

    drawCtx.shadowBlur =
        15;


    drawCtx.shadowColor =
        color;


    /*
       Petals
    */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const a =
            i *
            Math.PI *
            2 /
            5;


        const px =
            Math.cos(a) *
            size;


        const py =
            Math.sin(a) *
            size;


        drawCtx.beginPath();


        drawCtx.fillStyle =
            color;


        drawCtx.globalAlpha =
            .85;


        drawCtx.arc(

            px,

            py,

            size * .65,

            0,

            Math.PI * 2

        );


        drawCtx.fill();

    }


    /*
       Center
    */

    drawCtx.beginPath();


    drawCtx.fillStyle =
        "#fff3a3";


    drawCtx.globalAlpha =
        1;


    drawCtx.arc(

        0,

        0,

        size * .42,

        0,

        Math.PI * 2

    );


    drawCtx.fill();


    /*
       Sparkle
    */

    if (
        flowerCounter % 4 === 0
    ) {

        drawCtx.fillStyle =
            "#ffffff";

        drawCtx.font =
            "14px Arial";

        drawCtx.fillText(
            "✦",
            size + 4,
            -size - 4
        );

    }


    drawCtx.restore();

}


/* =====================================================
   DRAW CONNECTION
===================================================== */

function drawConnection(
    x1,
    y1,
    x2,
    y2
) {

    drawCtx.save();


    drawCtx.beginPath();


    drawCtx.moveTo(
        x1,
        y1
    );


    drawCtx.lineTo(
        x2,
        y2
    );


    drawCtx.strokeStyle =
        "rgba(255,255,255,.18)";


    drawCtx.lineWidth =
        2;


    drawCtx.lineCap =
        "round";


    drawCtx.stroke();


    drawCtx.restore();

}


/* =====================================================
   DRAW HAND
===================================================== */

function processHand(
    landmarks,
    side
) {

    const mode =
        stableGesture(
            landmarks,
            side
        );


    /*
       Index finger
    */

    const index =
        landmarks[8];


    /*
       Mirror X
       because camera display
       is mirrored.
    */

    const x =
        (1 - index.x) *
        drawCanvas.width;


    const y =
        index.y *
        drawCanvas.height;


    /*
       LEFT
    */

    if (
        side === "Left"
    ) {

        if (
            mode === "draw"
        ) {

            if (

                leftPreviousX !== null &&

                leftPreviousY !== null

            ) {

                drawConnection(

                    leftPreviousX,

                    leftPreviousY,

                    x,

                    y

                );

            }


            drawFlower(
                x,
                y,
                "Left"
            );


            leftPreviousX =
                x;

            leftPreviousY =
                y;

        }

        else {

            leftPreviousX =
                null;

            leftPreviousY =
                null;

        }

    }


    /*
       RIGHT
    */

    else {

        if (
            mode === "draw"
        ) {

            if (

                rightPreviousX !== null &&

                rightPreviousY !== null

            ) {

                drawConnection(

                    rightPreviousX,

                    rightPreviousY,

                    x,

                    y

                );

            }


            drawFlower(
                x,
                y,
                "Right"
            );


            rightPreviousX =
                x;

            rightPreviousY =
                y;

        }

        else {

            rightPreviousX =
                null;

            rightPreviousY =
                null;

        }

    }


    return mode;

}


/* =====================================================
   DRAW SKELETON
===================================================== */

function drawHandSkeleton(
    landmarks,
    side
) {

    const connections = [

        [0,1],
        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

    ];


    if (
        side === "Left"
    ) {

        handCtx.strokeStyle =
            "rgba(255,100,200,.55)";

        handCtx.fillStyle =
            "rgba(255,120,210,.9)";

    }

    else {

        handCtx.strokeStyle =
            "rgba(80,210,255,.55)";

        handCtx.fillStyle =
            "rgba(90,220,255,.9)";

    }


    handCtx.lineWidth =
        2;


    /*
       Connections
    */

    for (
        const pair
        of connections
    ) {

        const a =
            landmarks[pair[0]];

        const b =
            landmarks[pair[1]];


        const x1 =
            (1 - a.x) *
            handCanvas.width;


        const y1 =
            a.y *
            handCanvas.height;


        const x2 =
            (1 - b.x) *
            handCanvas.width;


        const y2 =
            b.y *
            handCanvas.height;


        handCtx.beginPath();


        handCtx.moveTo(
            x1,
            y1
        );


        handCtx.lineTo(
            x2,
            y2
        );


        handCtx.stroke();

    }


    /*
       Points
    */

    for (
        const point
        of landmarks
    ) {

        const x =
            (1 - point.x) *
            handCanvas.width;


        const y =
            point.y *
            handCanvas.height;


        handCtx.beginPath();


        handCtx.arc(

            x,

            y,

            3,

            0,

            Math.PI * 2

        );


        handCtx.fill();

    }

}


/* =====================================================
   UPDATE HAND BOX
===================================================== */

function updateHandBox(
    side,
    mode,
    detected
) {

    const element =
        side === "Left"
            ? leftStatus
            : rightStatus;


    element.className =
        "handBox";


    if (!detected) {

        element.innerHTML =
            side === "Left"
                ? "👈 LEFT HAND: Not detected"
                : "👉 RIGHT HAND: Not detected";

        return;

    }


    element.classList.add(
        "active"
    );


    if (
        mode === "draw"
    ) {

        element.classList.add(
            "draw"
        );


        if (
            side === "Right"
        ) {

            element.classList.add(
                "right"
            );

        }


        element.innerHTML =
            side === "Left"
                ? "👈 LEFT: ☝️ DRAW"
                : "👉 RIGHT: ☝️ DRAW";

    }

    else if (
        mode === "clear"
    ) {

        element.innerHTML =
            side === "Left"
                ? "👈 LEFT: ✊ CLEAR"
                : "👉 RIGHT: ✊ CLEAR";

    }

    else {

        element.innerHTML =
            side === "Left"
                ? "👈 LEFT: ✋ PAUSE"
                : "👉 RIGHT: ✋ PAUSE";

    }

}


/* =====================================================
   UPDATE MAIN STATUS
===================================================== */

function updateMainStatus(
    leftMode,
    rightMode,
    handCount
) {

    /*
       Clear
    */

    if (

        leftMode === "clear" ||

        rightMode === "clear"

    ) {

        status.className =
            "status clear";

        status.innerHTML =
            "✊ CLEAR / DELETE";

        return;

    }


    /*
       Drawing
    */

    if (

        leftMode === "draw" &&

        rightMode === "draw"

    ) {

        status.className =
            "status draw";

        status.innerHTML =
            "☝️☝️ TWO HANDS DRAWING";

        return;

    }


    if (

        leftMode === "draw" ||

        rightMode === "draw"

    ) {

        status.className =
            "status draw";

        status.innerHTML =
            "☝️ DRAW MODE";

        return;

    }


    /*
       Pause
    */

    status.className =
        "status pause";


    if (
        handCount > 0
    ) {

        status.innerHTML =
            "✋ PAUSE MODE";

    }

    else {

        status.innerHTML =
            "👋 SHOW YOUR HAND";

    }

}


/* =====================================================
   CLEAR DRAWING
===================================================== */

function clearDrawing() {

    drawCtx.clearRect(

        0,

        0,

        drawCanvas.width,

        drawCanvas.height

    );


    leftPreviousX =
        null;

    leftPreviousY =
        null;

    rightPreviousX =
        null;

    rightPreviousY =
        null;


    flowerCounter =
        0;


    gestureHistory.Left =
        [];

    gestureHistory.Right =
        [];


    info.innerHTML =
        "🗑️ Drawing cleared";

}


/* =====================================================
   SAVE DRAWING
===================================================== */

function saveDrawing() {

    if (
        drawCanvas.width === 0 ||
        drawCanvas.height === 0
    ) {

        return;

    }


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        drawCanvas.width;


    temp.height =
        drawCanvas.height;


    const ctx =
        temp.getContext(
            "2d"
        );


    /*
       Background
    */

    ctx.fillStyle =
        "#080b16";


    ctx.fillRect(

        0,

        0,

        temp.width,

        temp.height

    );


    /*
       Drawing
    */

    ctx.drawImage(

        drawCanvas,

        0,

        0

    );


    /*
       Download
    */

    const link =
        document.createElement(
            "a"
        );


    link.download =
        "AirBloom_Drawing.png";


    link.href =
        temp.toDataURL(
            "image/png"
        );


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    info.innerHTML =
        "💾 Drawing saved!";

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile:
            function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    + file
                );

            }

    });


/*
   SETTINGS
*/

hands.setOptions({

    /*
       TWO HANDS
    */

    maxNumHands:
        2,


    /*
       0 = faster
       1 = more accurate

       We use 1 because
       you want stable detection.
    */

    modelComplexity:
        1,


    /*
       Detection threshold
    */

    minDetectionConfidence:
        0.60,


    /*
       Tracking threshold
    */

    minTrackingConfidence:
        0.60

});


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(
    results
) {

    /*
       Clear skeleton
    */

    handCtx.clearRect(

        0,

        0,

        handCanvas.width,

        handCanvas.height

    );


    /*
       Reset
    */

    let leftMode =
        "pause";


    let rightMode =
        "pause";


    let leftDetected =
        false;


    let rightDetected =
        false;


    /*
       No hands
    */

    if (

        !results.multiHandLandmarks ||

        results.multiHandLandmarks.length === 0

    ) {

        updateHandBox(
            "Left",
            "pause",
            false
        );


        updateHandBox(
            "Right",
            "pause",
            false
        );


        updateMainStatus(
            "pause",
            "pause",
            0
        );


        leftPreviousX =
            null;

        leftPreviousY =
            null;

        rightPreviousX =
            null;

        rightPreviousY =
            null;


        gestureHistory.Left =
            [];

        gestureHistory.Right =
            [];


        info.innerHTML =
            "👋 No hand detected";

        return;

    }


    /*
       Process hands
    */

    for (
        let i = 0;

        i <
        results.multiHandLandmarks.length;

        i++
    ) {

        const landmarks =
            results.multiHandLandmarks[i];


        /*
           MediaPipe handedness

           Because the video is
           displayed mirrored, we
           swap the labels to make
           them correspond to what
           the user sees.
        */

        let mediaSide =
            "Right";


        if (

            results.multiHandedness &&

            results.multiHandedness[i]

        ) {

            mediaSide =
                results
                    .multiHandedness[i]
                    .label;

        }


        /*
           Swap for selfie display
        */

        const side =
            mediaSide === "Left"
                ? "Right"
                : "Left";


        /*
           Process
        */

        const mode =
            processHand(
                landmarks,
                side
            );


        /*
           Skeleton
        */

        drawHandSkeleton(
            landmarks,
            side
        );


        /*
           Save state
        */

        if (
            side === "Left"
        ) {

            leftMode =
                mode;

            leftDetected =
                true;

        }

        else {

            rightMode =
                mode;

            rightDetected =
                true;

        }

    }


    /*
       Update UI
    */

    updateHandBox(

        "Left",

        leftMode,

        leftDetected

    );


    updateHandBox(

        "Right",

        rightMode,

        rightDetected

    );


    updateMainStatus(

        leftMode,

        rightMode,

        results.multiHandLandmarks.length

    );


    /*
       CLEAR
    */

    if (

        leftMode === "clear" ||

        rightMode === "clear"

    ) {

        const now =
            Date.now();


        if (
            now - lastClearTime
            > 1200
        ) {

            clearDrawing();


            lastClearTime =
                now;

        }

    }


    /*
       Info
    */

    info.innerHTML =

        "🖐️ " +

        results.multiHandLandmarks.length +

        " hand" +

        (
            results.multiHandLandmarks.length > 1
                ? "s"
                : ""
        ) +

        " detected";

}


/* =====================================================
   START CAMERA
===================================================== */

async function startAirBloom() {

    if (
        cameraStarted
    ) {

        return;

    }


    /*
       Check HTTPS

       localhost is also allowed.
    */

    const secure =
        window.isSecureContext;


    if (
        !secure
    ) {

        loadingText.innerHTML =

            "⚠️ Camera requires HTTPS";

        startButton.style.display =
            "none";


        info.innerHTML =
            "Open this site using GitHub Pages HTTPS.";


        return;

    }


    try {

        loadingText.innerHTML =
            "🌸 Requesting camera...";


        startButton.disabled =
            true;


        /*
           IMPORTANT:
           Ask permission through
           getUserMedia first.

           This works better on
           mobile browsers.
        */

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        /*
           Attach camera stream
        */

        video.srcObject =
            stream;


        await video.play();


        cameraStarted =
            true;


        loadingText.innerHTML =
            "🌸 AirBloom is ready!";


        startButton.style.display =
            "none";


        /*
           Resize after video
        */

        setTimeout(
            resizeCanvas,
            100
        );


        /*
           Start processing
        */

        processVideo();


        info.innerHTML =
            "👋 Show one or two hands";


    }

    catch (error) {

        console.error(
            error
        );


        startButton.disabled =
            false;


        loadingText.innerHTML =
            "❌ Camera could not start";


        startButton.innerHTML =
            "📷 Try Again";


        info.innerHTML =
            "Please allow camera access in your browser.";

    }

}


/* =====================================================
   VIDEO PROCESSING LOOP
===================================================== */

async function processVideo() {

    if (
        !cameraStarted
    ) {

        return;

    }


    /*
       Avoid overlapping
       MediaPipe calls.
    */

    if (
        !processing
    ) {

        processing =
            true;


        try {

            await hands.send({

                image:
                    video

            });

        }

        catch (error) {

            console.error(
                error
            );

        }


        processing =
            false;

    }


    /*
       Continue loop
    */

    requestAnimationFrame(
        processVideo
    );

}


/* =====================================================
   INITIAL UI
===================================================== */

loading.style.display =
    "flex";


</script>
