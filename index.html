<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#080b16">

    <title>🌸 AirBloom - Draw with Your Hands</title>


    <!-- =====================================================
         MEDIAPIPE HANDS CLASSIC
         PAS DE tasks-vision
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(157, 78, 221, 0.35),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(0, 187, 249, 0.25),
                    transparent 35%
                ),

                #080b16;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .app {

            width: 100%;

            max-width: 1150px;

            text-align: center;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        h1 {

            margin: 0;

            font-size: clamp(
                32px,
                5vw,
                52px
            );

            background:
                linear-gradient(
                    90deg,
                    #ff69b4,
                    #c77dff,
                    #67d9ff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .subtitle {

            margin-top: 8px;

            margin-bottom: 20px;

            color: #bdbdd0;

            font-size: 16px;
        }


        /* =====================================================
           CAMERA
        ====================================================== */

        .stage {

            position: relative;

            width: 100%;

            max-width: 1050px;

            margin: auto;

            overflow: hidden;

            border-radius: 25px;

            background: #000;

            box-shadow:
                0 0 50px
                rgba(150, 80, 255, 0.28);

            aspect-ratio: 16 / 9;
        }


        #video {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            display: block;
        }


        #drawCanvas,
        #handCanvas {

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        #loading {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            gap: 12px;

            background:
                rgba(5, 5, 15, 0.92);

            font-size: 19px;

            font-weight: bold;
        }


        .loader {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: 4px solid
                rgba(255,255,255,0.15);

            border-top-color:
                #ff69b4;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {

            display: inline-block;

            margin-top: 18px;

            padding: 12px 25px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.12);

            font-size: 17px;

            font-weight: bold;
        }


        .status.draw {

            color: #ff72c6;
        }


        .status.pause {

            color: #ffd166;
        }


        .status.clear {

            color: #ff6b6b;
        }


        .status.wait {

            color: #9da4c5;
        }


        /* =====================================================
           HAND STATUS
        ====================================================== */

        .handsStatus {

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 15px;
        }


        .handBox {

            min-width: 190px;

            padding: 10px 18px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color: #85889c;

            transition: 0.2s;
        }


        .handBox.active {

            color: white;

            background:
                rgba(255,255,255,0.09);
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .controls {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 18px;
        }


        button {

            border: none;

            padding: 13px 24px;

            border-radius: 25px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            -webkit-tap-highlight-color: transparent;
        }


        button:active {

            transform: scale(0.96);
        }


        .clear {

            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b2b
                );
        }


        .save {

            background:
                linear-gradient(
                    135deg,
                    #00b894,
                    #00cec9
                );
        }


        /* =====================================================
           INSTRUCTIONS
        ====================================================== */

        .instructions {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 22px;
        }


        .gesture {

            min-width: 165px;

            padding: 13px 18px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.08);
        }


        .gesture span {

            font-size: 27px;

            display: block;

            margin-bottom: 5px;
        }


        .gesture small {

            display: block;

            margin-top: 5px;

            color: #9da0b5;
        }


        #info {

            margin-top: 15px;

            color: #888ca2;

            font-size: 14px;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            body {

                padding: 10px;

                align-items: flex-start;
            }


            .app {

                margin-top: 12px;
            }


            h1 {

                font-size: 35px;
            }


            .subtitle {

                font-size: 14px;

                margin-bottom: 14px;
            }


            .stage {

                border-radius: 18px;

                aspect-ratio: 4 / 3;
            }


            .status {

                margin-top: 12px;

                padding: 10px 18px;

                font-size: 15px;
            }


            .handBox {

                min-width: 145px;

                font-size: 13px;

                padding: 9px 12px;
            }


            .gesture {

                min-width: 100px;

                flex: 1;
            }


            .gesture span {

                font-size: 23px;
            }


            button {

                padding: 12px 20px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1>
        🌸 AirBloom
    </h1>


    <div class="subtitle">
        Draw beautiful flowers in the air with your hands
    </div>


    <!-- =====================================================
         CAMERA STAGE
    ====================================================== -->

    <div class="stage">


        <div id="loading">

            <div class="loader"></div>

            <div>
                🌸 Starting AirBloom...
            </div>

            <small>
                Loading camera & hand detection
            </small>

        </div>


        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>


        <canvas id="drawCanvas"></canvas>

        <canvas id="handCanvas"></canvas>


    </div>


    <!-- =====================================================
         MAIN STATUS
    ====================================================== -->

    <div
        id="status"
        class="status wait">

        ⏳ Starting...

    </div>


    <!-- =====================================================
         HAND STATUS
    ====================================================== -->

    <div class="handsStatus">


        <div
            id="leftStatus"
            class="handBox">

            👈 LEFT HAND:
            Not detected

        </div>


        <div
            id="rightStatus"
            class="handBox">

            👉 RIGHT HAND:
            Not detected

        </div>


    </div>


    <!-- =====================================================
         BUTTONS
    ====================================================== -->

    <div class="controls">


        <button
            class="clear"
            onclick="clearDrawing()">

            🗑️ Clear

        </button>


        <button
            class="save"
            onclick="saveDrawing()">

            💾 Save Drawing

        </button>


    </div>


    <!-- =====================================================
         INSTRUCTIONS
    ====================================================== -->

    <div class="instructions">


        <div class="gesture">

            <span>☝️</span>

            <b>DRAW</b>

            <small>
                Index finger only
            </small>

        </div>


        <div class="gesture">

            <span>✋</span>

            <b>PAUSE</b>

            <small>
                Open hand
            </small>

        </div>


        <div class="gesture">

            <span>✊</span>

            <b>CLEAR</b>

            <small>
                Closed fist
            </small>

        </div>


    </div>


    <div id="info">
        Initializing...
    </div>


</div>


<script>

/* ==========================================================
   ELEMENTS
========================================================== */

const video =
    document.getElementById("video");

const drawCanvas =
    document.getElementById("drawCanvas");

const handCanvas =
    document.getElementById("handCanvas");

const drawCtx =
    drawCanvas.getContext("2d");

const handCtx =
    handCanvas.getContext("2d");

const loading =
    document.getElementById("loading");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const leftStatus =
    document.getElementById("leftStatus");

const rightStatus =
    document.getElementById("rightStatus");


/* ==========================================================
   VARIABLES
========================================================== */

let leftPreviousX = null;
let leftPreviousY = null;

let rightPreviousX = null;
let rightPreviousY = null;

let flowerCounter = 0;

let lastClearTime = 0;


/*
   IMPORTANT:

   Do not create a flower on every
   camera frame.

   This makes the application
   much smoother on phones.
*/

let lastFlowerTimeLeft = 0;

let lastFlowerTimeRight = 0;

const FLOWER_INTERVAL = 35;


/* ==========================================================
   COLORS
========================================================== */

const colors = [

    "#ff69b4",
    "#ff9de2",
    "#c77dff",
    "#9b5de5",
    "#00bbf9",
    "#00f5d4",
    "#fee440",
    "#ff7b00"

];


/* ==========================================================
   CANVAS RESIZE
========================================================== */

function resizeCanvas() {

    const rect =
        video.getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return;

    }


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    drawCanvas.width =
        Math.round(
            rect.width * ratio
        );

    drawCanvas.height =
        Math.round(
            rect.height * ratio
        );


    handCanvas.width =
        Math.round(
            rect.width * ratio
        );

    handCanvas.height =
        Math.round(
            rect.height * ratio
        );


    drawCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    handCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==========================================================
   DISPLAY SIZE
========================================================== */

function getDisplaySize() {

    const rect =
        video.getBoundingClientRect();


    return {

        width: rect.width,

        height: rect.height

    };

}


/* ==========================================================
   DISTANCE
========================================================== */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;


    return Math.sqrt(
        dx * dx + dy * dy
    );

}


/* ==========================================================
   FINGER DETECTION
========================================================== */

function isFingerExtended(
    landmarks,
    tipIndex,
    pipIndex
) {

    const wrist =
        landmarks[0];

    const tip =
        landmarks[tipIndex];

    const pip =
        landmarks[pipIndex];


    const tipDistance =
        distance(
            tip,
            wrist
        );


    const pipDistance =
        distance(
            pip,
            wrist
        );


    return (
        tipDistance >
        pipDistance * 1.12
    );

}


/* ==========================================================
   GESTURE DETECTION
========================================================== */

function detectGesture(landmarks) {

    const index =
        isFingerExtended(
            landmarks,
            8,
            6
        );


    const middle =
        isFingerExtended(
            landmarks,
            12,
            10
        );


    const ring =
        isFingerExtended(
            landmarks,
            16,
            14
        );


    const pinky =
        isFingerExtended(
            landmarks,
            20,
            18
        );


    /*
       INDEX ONLY
    */

    if (
        index &&
        !middle &&
        !ring &&
        !pinky
    ) {

        return "draw";

    }


    /*
       OPEN HAND
    */

    if (
        index &&
        middle &&
        ring &&
        pinky
    ) {

        return "pause";

    }


    /*
       FIST
    */

    if (
        !index &&
        !middle &&
        !ring &&
        !pinky
    ) {

        return "clear";

    }


    return "pause";

}


/* ==========================================================
   FLOWER
========================================================== */

function drawFlower(
    x,
    y,
    side
) {

    let color;


    if (side === "Left") {

        color = "#ff72c6";

    }

    else {

        color = "#67d9ff";

    }


    if (
        flowerCounter % 6 === 0
    ) {

        color =
            colors[
                flowerCounter %
                colors.length
            ];

    }


    flowerCounter++;


    const size =
        6 +
        Math.random() * 6;


    drawCtx.save();


    drawCtx.translate(
        x,
        y
    );


    /*
       Glow
    */

    drawCtx.shadowBlur = 10;

    drawCtx.shadowColor = color;


    /*
       Petals
    */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const angle =
            i *
            (
                Math.PI * 2 / 5
            );


        const px =
            Math.cos(angle) *
            size;


        const py =
            Math.sin(angle) *
            size;


        drawCtx.beginPath();


        drawCtx.fillStyle =
            color;


        drawCtx.globalAlpha =
            0.85;


        drawCtx.arc(
            px,
            py,
            size * 0.65,
            0,
            Math.PI * 2
        );


        drawCtx.fill();

    }


    /*
       Center
    */

    drawCtx.beginPath();


    drawCtx.fillStyle =
        "#fff3a3";


    drawCtx.globalAlpha = 1;


    drawCtx.arc(
        0,
        0,
        size * 0.42,
        0,
        Math.PI * 2
    );


    drawCtx.fill();


    /*
       Sparkle
    */

    if (
        flowerCounter % 4 === 0
    ) {

        drawCtx.fillStyle =
            "white";


        drawCtx.font =
            "15px Arial";


        drawCtx.fillText(
            "✦",
            size + 5,
            -size - 5
        );

    }


    drawCtx.restore();

}


/* ==========================================================
   CONNECTION
========================================================== */

function drawConnection(
    x1,
    y1,
    x2,
    y2
) {

    drawCtx.save();


    drawCtx.beginPath();


    drawCtx.moveTo(
        x1,
        y1
    );


    drawCtx.lineTo(
        x2,
        y2
    );


    drawCtx.strokeStyle =
        "rgba(255,255,255,0.18)";


    drawCtx.lineWidth = 2;


    drawCtx.stroke();


    drawCtx.restore();

}


/* ==========================================================
   PROCESS HAND
========================================================== */

function processHand(
    landmarks,
    side
) {

    const mode =
        detectGesture(
            landmarks
        );


    const index =
        landmarks[8];


    const size =
        getDisplaySize();


    /*
       Mirror X
    */

    const x =
        (1 - index.x) *
        size.width;


    const y =
        index.y *
        size.height;


    const now =
        Date.now();


    /* ======================================================
       LEFT HAND
    ====================================================== */

    if (
        side === "Left"
    ) {

        if (
            mode === "draw"
        ) {

            /*
               Draw only every
               FLOWER_INTERVAL ms.
            */

            if (
                now -
                lastFlowerTimeLeft
                >=
                FLOWER_INTERVAL
            ) {

                if (
                    leftPreviousX !== null &&
                    leftPreviousY !== null
                ) {

                    drawConnection(
                        leftPreviousX,
                        leftPreviousY,
                        x,
                        y
                    );

                }


                drawFlower(
                    x,
                    y,
                    "Left"
                );


                lastFlowerTimeLeft =
                    now;

            }


            leftPreviousX =
                x;

            leftPreviousY =
                y;

        }

        else {

            leftPreviousX =
                null;

            leftPreviousY =
                null;

        }

    }


    /* ======================================================
       RIGHT HAND
    ====================================================== */

    else {

        if (
            mode === "draw"
        ) {

            if (
                now -
                lastFlowerTimeRight
                >=
                FLOWER_INTERVAL
            ) {

                if (
                    rightPreviousX !== null &&
                    rightPreviousY !== null
                ) {

                    drawConnection(
                        rightPreviousX,
                        rightPreviousY,
                        x,
                        y
                    );

                }


                drawFlower(
                    x,
                    y,
                    "Right"
                );


                lastFlowerTimeRight =
                    now;

            }


            rightPreviousX =
                x;

            rightPreviousY =
                y;

        }

        else {

            rightPreviousX =
                null;

            rightPreviousY =
                null;

        }

    }


    return mode;

}


/* ==========================================================
   HAND SKELETON
========================================================== */

function drawHandSkeleton(
    landmarks,
    side
) {

    const size =
        getDisplaySize();


    const connections = [

        [0,1],
        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

    ];


    if (
        side === "Left"
    ) {

        handCtx.strokeStyle =
            "rgba(255,100,200,0.65)";

        handCtx.fillStyle =
            "rgba(255,120,210,0.95)";

    }

    else {

        handCtx.strokeStyle =
            "rgba(80,210,255,0.65)";

        handCtx.fillStyle =
            "rgba(90,220,255,0.95)";

    }


    handCtx.lineWidth = 2;


    /*
       Lines
    */

    for (
        const pair
        of connections
    ) {

        const a =
            landmarks[pair[0]];

        const b =
            landmarks[pair[1]];


        const x1 =
            (1 - a.x) *
            size.width;


        const y1 =
            a.y *
            size.height;


        const x2 =
            (1 - b.x) *
            size.width;


        const y2 =
            b.y *
            size.height;


        handCtx.beginPath();


        handCtx.moveTo(
            x1,
            y1
        );


        handCtx.lineTo(
            x2,
            y2
        );


        handCtx.stroke();

    }


    /*
       Points
    */

    for (
        const point
        of landmarks
    ) {

        const x =
            (1 - point.x) *
            size.width;


        const y =
            point.y *
            size.height;


        handCtx.beginPath();


        handCtx.arc(
            x,
            y,
            3,
            0,
            Math.PI * 2
        );


        handCtx.fill();

    }

}


/* ==========================================================
   HAND STATUS
========================================================== */

function updateHandStatus(
    side,
    mode,
    detected
) {

    let element;


    if (
        side === "Left"
    ) {

        element =
            leftStatus;

    }

    else {

        element =
            rightStatus;

    }


    if (!detected) {

        element.className =
            "handBox";


        element.innerHTML =
            side === "Left"

            ? "👈 LEFT HAND: Not detected"

            : "👉 RIGHT HAND: Not detected";


        return;

    }


    element.className =
        "handBox active";


    if (
        mode === "draw"
    ) {

        element.innerHTML =
            side === "Left"

            ? "👈 LEFT: ☝️ DRAW"

            : "👉 RIGHT: ☝️ DRAW";

    }

    else if (
        mode === "pause"
    ) {

        element.innerHTML =
            side === "Left"

            ? "👈 LEFT: ✋ PAUSE"

            : "👉 RIGHT: ✋ PAUSE";

    }

    else {

        element.innerHTML =
            side === "Left"

            ? "👈 LEFT: ✊ CLEAR"

            : "👉 RIGHT: ✊ CLEAR";

    }

}


/* ==========================================================
   MAIN STATUS
========================================================== */

function updateMainStatus(
    leftMode,
    rightMode,
    count
) {

    status.className =
        "status";


    /*
       CLEAR
    */

    if (
        leftMode === "clear" ||
        rightMode === "clear"
    ) {

        status.classList.add(
            "clear"
        );


        status.innerHTML =
            "✊ CLEAR / DELETE";


        return;

    }


    /*
       TWO HANDS DRAWING
    */

    if (
        leftMode === "draw" &&
        rightMode === "draw"
    ) {

        status.classList.add(
            "draw"
        );


        status.innerHTML =
            "☝️☝️ TWO HANDS DRAWING";


        return;

    }


    /*
       ONE HAND DRAWING
    */

    if (
        leftMode === "draw" ||
        rightMode === "draw"
    ) {

        status.classList.add(
            "draw"
        );


        status.innerHTML =
            "☝️ DRAW MODE";


        return;

    }


    /*
       PAUSE
    */

    if (
        count > 0
    ) {

        status.classList.add(
            "pause"
        );


        status.innerHTML =
            "✋ PAUSE MODE";

    }

    else {

        status.classList.add(
            "wait"
        );


        status.innerHTML =
            "👋 SHOW YOUR HAND";

    }

}


/* ==========================================================
   MEDIAPIPE RESULTS
========================================================== */

function onResults(results) {

    const size =
        getDisplaySize();


    /*
       Clear hand skeleton
    */

    handCtx.clearRect(
        0,
        0,
        size.width,
        size.height
    );


    /*
       Reset status
    */

    updateHandStatus(
        "Left",
        "pause",
        false
    );


    updateHandStatus(
        "Right",
        "pause",
        false
    );


    /*
       No hand
    */

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        leftPreviousX = null;
        leftPreviousY = null;

        rightPreviousX = null;
        rightPreviousY = null;


        updateMainStatus(
            "pause",
            "pause",
            0
        );


        info.innerHTML =
            "👋 No hand detected";


        return;

    }


    let leftMode =
        "pause";


    let rightMode =
        "pause";


    let leftDetected =
        false;


    let rightDetected =
        false;


    /*
       Process hands
    */

    for (
        let i = 0;
        i < results.multiHandLandmarks.length;
        i++
    ) {

        const landmarks =
            results.multiHandLandmarks[i];


        let side =
            "Right";


        /*
           MediaPipe handedness
        */

        if (
            results.multiHandedness &&
            results.multiHandedness[i]
        ) {

            side =
                results
                    .multiHandedness[i]
                    .label;

        }


        const mode =
            processHand(
                landmarks,
                side
            );


        /*
           Skeleton
        */

        drawHandSkeleton(
            landmarks,
            side
        );


        /*
           Status
        */

        if (
            side === "Left"
        ) {

            leftMode =
                mode;

            leftDetected =
                true;

        }

        else {

            rightMode =
                mode;

            rightDetected =
                true;

        }

    }


    /*
       Update UI
    */

    updateHandStatus(
        "Left",
        leftMode,
        leftDetected
    );


    updateHandStatus(
        "Right",
        rightMode,
        rightDetected
    );


    updateMainStatus(
        leftMode,
        rightMode,
        results.multiHandLandmarks.length
    );


    /*
       CLEAR WITH FIST
    */

    if (
        leftMode === "clear" ||
        rightMode === "clear"
    ) {

        const now =
            Date.now();


        if (
            now - lastClearTime > 1200
        ) {

            clearDrawing();


            lastClearTime =
                now;

        }

    }


    info.innerHTML =
        "🖐️ " +
        results.multiHandLandmarks.length +
        " hand(s) detected";

}


/* ==========================================================
   MEDIAPIPE HANDS
========================================================== */

const hands =
    new Hands({

        locateFile: function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                file
            );

        }

    });


/*
   OPTIMIZED FOR MOBILE

   modelComplexity 0 = faster
*/

hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 0,

    minDetectionConfidence: 0.55,

    minTrackingConfidence: 0.55

});


hands.onResults(
    onResults
);


/* ==========================================================
   CAMERA
========================================================== */

let camera = null;


/* ==========================================================
   START CAMERA
========================================================== */

async function startAirBloom() {

    try {

        info.innerHTML =
            "📷 Starting camera...";


        /*
           Lower resolution
           = much faster on phones
        */

        camera =
            new Camera(
                video,
                {

                    onFrame:
                        async function() {

                            await hands.send({
                                image: video
                            });

                        },


                    width: 640,

                    height: 480

                }
            );


        await camera.start();


        /*
           Camera started
        */

        loading.style.display =
            "none";


        resizeCanvas();


        status.className =
            "status pause";


        status.innerHTML =
            "👋 SHOW YOUR HAND";


        info.innerHTML =
            "👋 Show one or two hands";

    }

    catch (error) {

        console.error(
            "AIRBLOOM CAMERA ERROR:",
            error
        );


        loading.innerHTML = `

            <div style="
                font-size:40px;
            ">
                ❌
            </div>

            <div>
                Camera could not start
            </div>

            <small style="
                color:#aaa;
                text-align:center;
                padding:0 20px;
            ">
                Please allow camera permission
                and reload the page.
            </small>

        `;

    }

}


/* ==========================================================
   CLEAR
========================================================== */

function clearDrawing() {

    const size =
        getDisplaySize();


    drawCtx.clearRect(
        0,
        0,
        size.width,
        size.height
    );


    leftPreviousX = null;
    leftPreviousY = null;

    rightPreviousX = null;
    rightPreviousY = null;


    flowerCounter = 0;

}


/* ==========================================================
   SAVE DRAWING
========================================================== */

function saveDrawing() {

    const size =
        getDisplaySize();


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        Math.round(
            size.width * ratio
        );


    temp.height =
        Math.round(
            size.height * ratio
        );


    const ctx =
        temp.getContext("2d");


    /*
       Background
    */

    ctx.fillStyle =
        "#080b16";


    ctx.fillRect(
        0,
        0,
        temp.width,
        temp.height
    );


    /*
       Drawing
    */

    ctx.drawImage(
        drawCanvas,
        0,
        0,
        temp.width,
        temp.height
    );


    /*
       Download
    */

    const link =
        document.createElement(
            "a"
        );


    link.download =
        "AirBloom_Drawing.png";


    link.href =
        temp.toDataURL(
            "image/png"
        );


    link.click();

}


/* ==========================================================
   START AIRBLOOM
========================================================== */

window.addEventListener(
    "load",
    function() {

        /*
           Small delay to allow
           MediaPipe scripts to load.
        */

        setTimeout(
            startAirBloom,
            500
        );

    }
);

</script>
